[project]
authors = ["Kirpal Grewal <kirpal@outlook.com>"]
channels = ["conda-forge", "pytorch", "nvidia"]
description = "Add a short description here"
name = "Dihedrals"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "~=3.10.0"
pytorch = "~=2.3.1"
gfortran = ">=14.1.0,<15"
cmake = ">=3.30.2,<4"
make = ">=4.3,<5"
safetensors = ">=0.4.3,<0.5"
numpy = ">=2.0.1,<3"
wget = ">=1.21.4,<2"
tar = ">=1.34,<2"

[feature.cpu.dependencies]
pytorch = { version = ">=2.3.1,<3", channel = "pytorch" }

[feature.cuda]
platforms = ["linux-64"]
channels = ["nvidia", { channel = "pytorch", priority = -1 }]
system-requirements = { cuda = "12" }

[feature.cuda.dependencies]
pytorch = { version = "~=2.3.1", channel = "pytorch" }
pytorch-cuda = { version = "12.1.*", channel = "pytorch" }
cuda-version = { version = "12.1", channel = "conda-forge" }

[environments]
cpu = { features = ["cpu"] }
cuda = { features = ["cuda"] }
