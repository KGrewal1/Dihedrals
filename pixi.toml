[project]
authors = ["Kirpal Grewal <kirpal@outlook.com>"]
channels = ["conda-forge", "pytorch"]
description = "Add a short description here"
name = "Dihedrals"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
train = "predict_connected.py"

[dependencies]
python = "3.10.*"
safetensors = ">=0.4.3,<0.5"

[feature.cpu.dependencies]
safetensors = ">=0.4.3,<0.5"
pytorch = ">=2.3.1,<3"

[feature.cuda]
system-requirements = { cuda = "12" }
channels = ["nvidia"]

[feature.cuda.dependencies]
pytorch-cuda = "12.1.*"
pytorch = ">=2.3.1,<3"

[environments]
cpu = { features = ["cpu"] }
cuda = { features = ["cuda"] }
